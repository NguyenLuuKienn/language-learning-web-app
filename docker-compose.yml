version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: language_learning_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-language_learning_db}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: language_learning_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING:?Set CONNECTION_STRING in .env}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      Jwt__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      Security__TrustProxyClientIp: "true"
      Media__StoragePath: /app/storage/uploads
      Security__DataProtectionKeysPath: /app/storage/keys
      Jwt__Issuer: ${JWT_ISSUER:-LanguageLearningApp}
      Jwt__Audience: ${JWT_AUDIENCE:-LanguageLearningAppClient}
    expose:
      - "8080"
    volumes:
      - media_data:/app/storage/uploads
      - auth_keys:/app/storage/keys
    networks:
      - app_network

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: language_learning_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - app_network

volumes:
  mysql_data:
    driver: local
  media_data:
    driver: local
  auth_keys:
    driver: local

networks:
  app_network:
    driver: bridge
