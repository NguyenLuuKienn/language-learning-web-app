version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: language_learning_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-language_learning_db}
      MYSQL_USER: ${MYSQL_USER:-app_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_password_123}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password_123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: language_learning_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING:-Server=db;Port=3306;Database=language_learning_db;User=app_user;Password=app_password_123;TreatTinyAsBoolean=true;}
      Jwt__SecretKey: ${JWT_SECRET_KEY:-super_secret_jwt_key_at_least_32_characters_long_12345}
      Jwt__Issuer: ${JWT_ISSUER:-LanguageLearningApp}
      Jwt__Audience: ${JWT_AUDIENCE:-LanguageLearningAppClient}
    ports:
      - "${API_PORT:-5000}:8080"
    networks:
      - app_network

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: language_learning_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api/v1}
    networks:
      - app_network

volumes:
  mysql_data:
    driver: local

networks:
  app_network:
    driver: bridge
